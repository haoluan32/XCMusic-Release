name: Multi-Platform Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "Build*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set Python 2.7 for electron-builder
        if: matrix.os == 'macos-latest'
        run: echo "PYTHON_PATH=/usr/bin/python2.7" >> $GITHUB_ENV
        
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build-mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build (Windows / Linux)
        if: matrix.os != 'macos-latest'
        run: npm run electron:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.snap
            dist_electron/*.tar.gz
            !dist_electron/*.blockmap
            !dist_electron/*.yml
            !dist_electron/*.yaml
          retention-days: 3
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "构建 ${{ steps.date.outputs.date }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动构建发布

            - **构建日期**：${{ steps.date.outputs.date }}
            - **触发方式**：${{ github.event_name }}
            - **Commit**：`${{ github.sha }}`

            本次发布包含 Windows、macOS、Linux 三平台构建产物。
          files: release-files/**/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
